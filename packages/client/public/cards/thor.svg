<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="thor-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#thor-bg)"/>
  <!-- Storm Clouds / Lightning Background -->
  <path d="M40 20 L70 80 L55 85 L90 140" stroke="url(#lightning)" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M260 20 L230 80 L245 85 L210 140" stroke="url(#lightning)" stroke-width="3" fill="none" opacity="0.7"/>
  <!-- Asgardian Armor / Chest -->
  <path d="M80 180 L150 160 L220 180 L230 290 L70 290 Z" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <!-- Armor Circles (Iconic Thor Discs) -->
  <circle cx="115" cy="210" r="18" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="185" cy="210" r="18" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="115" cy="260" r="16" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="185" cy="260" r="16" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <!-- Red Cape -->
  <path d="M60 170 C40 210 30 280 40 300 L75 280 L70 175 Z" fill="#b91c1c"/>
  <path d="M240 170 C260 210 270 280 260 300 L225 280 L230 175 Z" fill="#b91c1c"/>
  <!-- Thor Head / Beard -->
  <path d="M150 50 C115 50 100 80 100 120 C100 160 120 185 150 190 C180 185 200 160 200 120 C200 80 185 50 150 50 Z" fill="#fed7aa" stroke="#78350f" stroke-width="3"/>
  <!-- Golden Hair -->
  <path d="M100 100 C90 120 85 160 90 180 C95 150 105 130 110 100 Z" fill="#facc15"/>
  <path d="M200 100 C210 120 215 160 210 180 C205 150 195 130 190 100 Z" fill="#facc15"/>
  <path d="M100 80 C120 50 180 50 200 80 C180 65 120 65 100 80 Z" fill="#eab308"/>
  <!-- Beard -->
  <path d="M120 140 C120 175 135 190 150 190 C165 190 180 175 180 140 C175 160 165 170 150 170 C135 170 125 160 120 140 Z" fill="#ca8a04"/>
  <!-- Glowing Thunder Eyes -->
  <ellipse cx="130" cy="115" rx="7" ry="5" fill="url(#lightning)" filter="drop-shadow(0 0 4px #38bdf8)"/>
  <ellipse cx="170" cy="115" rx="7" ry="5" fill="url(#lightning)" filter="drop-shadow(0 0 4px #38bdf8)"/>
</svg>
