<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="luffy-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="cloud-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#luffy-bg)"/>
  <!-- Gear 5 Sun God Clouds Swirling -->
  <path d="M50 140 C20 100 40 40 90 60 C110 30 170 30 190 60 C240 40 260 100 230 140 C270 170 250 240 210 230 C200 270 140 270 120 240 C70 260 40 200 60 160 Z" fill="url(#cloud-hair)" opacity="0.9" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Face -->
  <circle cx="150" cy="140" r="50" fill="#fed7aa" stroke="#78350f" stroke-width="3"/>
  <!-- Iconic Under-Eye Scar -->
  <path d="M125 155 L130 165 L125 170" stroke="#991b1b" stroke-width="2" fill="none"/>
  <line x1="123" y1="160" x2="133" y2="160" stroke="#991b1b" stroke-width="2"/>
  <line x1="123" y1="166" x2="131" y2="166" stroke="#991b1b" stroke-width="2"/>
  <!-- Joyful Sun Eyes (Glowing Red Rings) -->
  <circle cx="130" cy="135" r="9" fill="#dc2626" stroke="#450a0a" stroke-width="2"/>
  <circle cx="130" cy="135" r="4" fill="#fef08a"/>
  <circle cx="170" cy="135" r="9" fill="#dc2626" stroke="#450a0a" stroke-width="2"/>
  <circle cx="170" cy="135" r="4" fill="#fef08a"/>
  <!-- Huge Joyboy Grin -->
  <path d="M120 160 Q150 195 180 160 Z" fill="#ffffff" stroke="#78350f" stroke-width="3"/>
  <!-- Straw Hat Hanging on Back -->
  <ellipse cx="150" cy="245" rx="60" ry="20" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <ellipse cx="150" cy="245" rx="35" ry="10" fill="#dc2626"/>
</svg>
