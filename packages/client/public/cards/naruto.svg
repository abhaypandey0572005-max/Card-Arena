      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#naruto-bg)"/>
  <!-- Spiky Blonde Hair -->
  <polygon points="150,15 130,55 170,55" fill="#facc15"/>
  <polygon points="115,25 90,65 135,65" fill="#facc15"/>
  <polygon points="185,25 210,65 165,65" fill="#facc15"/>
