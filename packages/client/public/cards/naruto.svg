  <rect x="90" y="80" width="120" height="35" rx="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="110" y="85" width="80" height="25" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Hidden Leaf Spiral Symbol -->
  <path d="M145 95 C155 95 158 102 153 105 C148 107 143 100 150 97" stroke="#334155" stroke-width="2.5" fill="none"/>
