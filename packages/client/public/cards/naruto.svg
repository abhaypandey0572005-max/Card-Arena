    <line x1="100" y1="160" x2="115" y2="162"/>
    <line x1="100" y1="170" x2="115" y2="170"/>
    <line x1="100" y1="180" x2="115" y2="178"/>
    <line x1="200" y1="160" x2="185" y2="162"/>
    <line x1="200" y1="170" x2="185" y2="170"/>
    <line x1="200" y1="180" x2="185" y2="178"/>
