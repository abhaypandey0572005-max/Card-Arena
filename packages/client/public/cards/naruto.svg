  <path d="M70 230 L150 205 L230 230 L250 300 L50 300 Z" fill="#ea580c" stroke="#9a3412" stroke-width="4"/>
  <path d="M50 300 L70 230 L110 240 L100 300 Z" fill="#18181b"/>
  <path d="M250 300 L230 230 L190 240 L200 300 Z" fill="#18181b"/>
