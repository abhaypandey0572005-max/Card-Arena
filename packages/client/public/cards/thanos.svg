<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="thanos-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="gold-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="titan-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#thanos-bg)"/>
  <!-- Thanos Head -->
  <path d="M150 45 C105 45 80 80 80 145 C80 205 105 255 150 265 C195 255 220 205 220 145 C220 80 195 45 150 45 Z" fill="url(#titan-skin)" stroke="#2e1065" stroke-width="4"/>
  <!-- Warlord Gold Helmet -->
  <path d="M75 110 C75 50 110 30 150 30 C190 30 225 50 225 110 L210 125 L190 70 L150 85 L110 70 L90 125 Z" fill="url(#gold-armor)" stroke="#713f12" stroke-width="3"/>
  <!-- Chin Ridges (Iconic Thanos feature) -->
  <g stroke="#3b0764" stroke-width="3" stroke-linecap="round">
    <line x1="125" y1="215" x2="125" y2="250"/>
    <line x1="137" y1="218" x2="137" y2="255"/>
    <line x1="150" y1="220" x2="150" y2="260"/>
    <line x1="163" y1="218" x2="163" y2="255"/>
    <line x1="175" y1="215" x2="175" y2="250"/>
  </g>
  <!-- Piercing Eyes (Glowing Violet) -->
  <ellipse cx="120" cy="135" rx="14" ry="7" fill="#f43f5e" stroke="#881337" stroke-width="2"/>
  <circle cx="120" cy="135" r="3" fill="#ffffff"/>
  <ellipse cx="180" cy="135" rx="14" ry="7" fill="#f43f5e" stroke="#881337" stroke-width="2"/>
  <circle cx="180" cy="135" r="3" fill="#ffffff"/>
  <!-- Stern Brow -->
  <path d="M100 125 Q120 120 145 130" stroke="#3b0764" stroke-width="4" fill="none"/>
  <path d="M200 125 Q180 120 155 130" stroke="#3b0764" stroke-width="4" fill="none"/>
</svg>
