      <stop offset="0%" stop-color="#15803d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="gamma-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#hulk-bg)"/>
  <!-- Massive Traps / Shoulders -->
  <path d="M40 280 C40 180 80 160 110 150 L190 150 C220 160 260 180 260 280 Z" fill="url(#gamma-skin)" stroke="#052e16" stroke-width="4"/>
