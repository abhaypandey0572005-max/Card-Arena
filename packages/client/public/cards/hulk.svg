  <path d="M95 125 C120 105 145 130 150 130 C155 130 180 105 205 125" stroke="#052e16" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Glowing Green Eyes -->
  <ellipse cx="120" cy="140" rx="10" ry="6" fill="#86efac" stroke="#052e16" stroke-width="2"/>
  <circle cx="120" cy="140" r="3" fill="#052e16"/>
  <ellipse cx="180" cy="140" rx="10" ry="6" fill="#86efac" stroke="#052e16" stroke-width="2"/>
  <circle cx="180" cy="140" r="3" fill="#052e16"/>
