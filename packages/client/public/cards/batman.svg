<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bat-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#bat-bg)"/>
  <!-- Bat Shoulders / Cape Silhouette -->
  <path d="M50 200 L150 170 L250 200 L270 300 L30 300 Z" fill="#09090b" stroke="#1e293b" stroke-width="4"/>
  <!-- Bat Symbol on Chest -->
  <path d="M150 215 C145 200 135 200 130 210 C125 200 115 200 110 215 C110 230 130 245 150 255 C170 245 190 230 190 215 C185 200 175 200 170 210 C165 200 155 200 150 215 Z" fill="#eab308" stroke="#713f12" stroke-width="2"/>
  <!-- Dark Knight Cowl / Head -->
  <path d="M150 40 L195 20 L190 100 C205 130 205 160 185 180 L150 190 L115 180 C95 160 95 130 110 100 L105 20 Z" fill="#0f172a" stroke="#020617" stroke-width="4"/>
  <!-- Cowl Face Opening -->
  <polygon points="120,135 180,135 170,175 130,175" fill="#fed7aa"/>
  <!-- Stern Mouth -->
  <line x1="135" y1="160" x2="165" y2="160" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <!-- Glowing White Narrow Eyes -->
  <polygon points="120,115 142,125 140,130 122,122" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)"/>
  <polygon points="180,115 158,125 160,130 178,122" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)"/>
</svg>
