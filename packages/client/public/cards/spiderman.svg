<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="spidey-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="suit-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="eye-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" rx="20" fill="url(#spidey-bg)"/>
  <!-- Web Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.6">
    <line x1="150" y1="150" x2="0" y2="0"/>
    <line x1="150" y1="150" x2="300" y2="0"/>
    <line x1="150" y1="150" x2="300" y2="300"/>
    <line x1="150" y1="150" x2="0" y2="300"/>
    <line x1="150" y1="150" x2="150" y2="0"/>
    <line x1="150" y1="150" x2="300" y2="150"/>
    <line x1="150" y1="150" x2="150" y2="300"/>
    <line x1="150" y1="150" x2="0" y2="150"/>
    <circle cx="150" cy="150" r="40" fill="none"/>
    <circle cx="150" cy="150" r="80" fill="none"/>
    <circle cx="150" cy="150" r="120" fill="none"/>
  </g>
  <!-- Spider-Man Head / Mask -->
  <path d="M150 40 C100 40 70 85 70 145 C70 205 110 260 150 270 C190 260 230 205 230 145 C230 85 200 40 150 40 Z" fill="url(#suit-red)" stroke="#0f172a" stroke-width="4"/>
  <!-- Mask Web Lines -->
  <g stroke="#0f172a" stroke-width="2" opacity="0.75">
    <line x1="150" y1="160" x2="150" y2="40"/>
    <line x1="150" y1="160" x2="100" y2="55"/>
    <line x1="150" y1="160" x2="200" y2="55"/>
    <line x1="150" y1="160" x2="70" y2="120"/>
    <line x1="150" y1="160" x2="230" y2="120"/>
    <line x1="150" y1="160" x2="80" y2="200"/>
    <line x1="150" y1="160" x2="220" y2="200"/>
    <line x1="150" y1="160" x2="150" y2="270"/>
  </g>
  <!-- Left Eye -->
  <path d="M140 135 C130 115 95 120 85 140 C80 155 100 175 135 170 C142 160 142 145 140 135 Z" fill="url(#eye-glow)" stroke="#0f172a" stroke-width="6"/>
  <!-- Right Eye -->
  <path d="M160 135 C170 115 205 120 215 140 C220 155 200 175 165 170 C158 160 158 145 160 135 Z" fill="url(#eye-glow)" stroke="#0f172a" stroke-width="6"/>
</svg>
